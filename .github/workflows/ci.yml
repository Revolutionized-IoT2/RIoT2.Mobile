name: CI

# Push and pull request: unit tests on Linux. Weekly and on demand: also the Android APK build.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    uses: Revolutionized-IoT2/.github/.github/workflows/dotnet-validate.yml@main
    with:
      build: Tests/RIoT2.Mobile.Tests.csproj
      test: Tests/RIoT2.Mobile.Tests.csproj
      github-packages: false

  android:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/android.yml

  secret-scan:
    uses: Revolutionized-IoT2/.github/.github/workflows/secret-scan.yml@main
